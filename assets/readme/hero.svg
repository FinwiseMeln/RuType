<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">RuType — фоновый автокорректор и переключатель раскладки для Windows</title>
  <desc id="hero-desc">RuType исправляет опечатки и переключает раскладку, когда слово набрано не в той: ghbdtn становится приветом, пщщпдуюсщь — google.com. Работает офлайн, портабельно.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182B4E"/>
      <stop offset="1" stop-color="#12213E"/>
    </linearGradient>
  </defs>

  <!-- background panel -->
  <rect width="1200" height="380" rx="24" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#2B4066" stroke-width="1"/>

  <!-- ==================== title block ==================== -->
  <g id="title-block" transform="translate(64 0)">

    <!-- eyebrow -->
    <text x="0" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="17" letter-spacing="3" fill="#7E93BC">ФОНОВЫЙ АВТОКОРРЕКТОР · WINDOWS</text>

    <!-- project name -->
    <text x="0" y="158" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="78" font-weight="700" fill="#FFFFFF">Ru<tspan fill="#4CC2FF">Type</tspan></text>

    <!-- plain-language promise -->
    <text x="0" y="212" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="23" fill="#C9D5EA">Чинит опечатки и сам переключает раскладку,</text>
    <text x="0" y="244" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="23" fill="#C9D5EA">когда слово набрано не в той.</text>
    <text x="0" y="286" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="21" fill="#8CA0C2">Замена Punto Switcher без облака, рекламы и телеметрии.</text>

    <!-- metadata chips -->
    <g id="chips" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect x="0" y="312" width="168" height="36" rx="18" fill="none" stroke="#31476F" stroke-width="1"/>
      <circle cx="24" cy="330" r="4" fill="#4CC2FF"/>
      <text x="38" y="336" fill="#AFC0DD">Windows 10/11</text>

      <rect x="182" y="312" width="150" height="36" rx="18" fill="none" stroke="#31476F" stroke-width="1"/>
      <circle cx="206" cy="330" r="4" fill="#4CC2FF"/>
      <text x="220" y="336" fill="#AFC0DD">Портабельно</text>

      <rect x="346" y="312" width="188" height="36" rx="18" fill="none" stroke="#31476F" stroke-width="1"/>
      <circle cx="370" cy="330" r="4" fill="#4CC2FF"/>
      <text x="384" y="336" fill="#AFC0DD">Работает офлайн</text>
    </g>
  </g>

  <!-- ==================== proof card ==================== -->
  <g id="proof-card" transform="translate(676 48)">
    <rect width="460" height="284" rx="18" fill="#0D1A31" stroke="#263B63" stroke-width="1"/>

    <text x="32" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15" letter-spacing="2" fill="#67799C">НАБРАНО → СТАЛО</text>

    <!-- row 1 -->
    <text x="32" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="27" fill="#7C8FB0">ghbdtn</text>
    <g transform="translate(224 103)" stroke="#4CC2FF" stroke-width="3" fill="#4CC2FF" stroke-linecap="round">
      <line x1="0" y1="4" x2="26" y2="4"/>
      <path d="M26 4 L18 -1 L18 9 Z" stroke="none"/>
      <line x1="26" y1="16" x2="0" y2="16"/>
      <path d="M0 16 L8 11 L8 21 Z" stroke="none"/>
    </g>
    <text x="280" y="116" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="27" font-weight="600" fill="#4CC2FF">привет</text>

    <!-- row 2 -->
    <text x="32" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="27" fill="#7C8FB0">пщщпдуюсщь</text>
    <g transform="translate(224 173)" stroke="#4CC2FF" stroke-width="3" fill="#4CC2FF" stroke-linecap="round">
      <line x1="0" y1="4" x2="26" y2="4"/>
      <path d="M26 4 L18 -1 L18 9 Z" stroke="none"/>
      <line x1="26" y1="16" x2="0" y2="16"/>
      <path d="M0 16 L8 11 L8 21 Z" stroke="none"/>
    </g>
    <text x="280" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="27" font-weight="600" fill="#4CC2FF">google.com</text>

    <!-- row 3 -->
    <text x="32" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="27" fill="#7C8FB0">ghjljk;bnm?</text>
    <g transform="translate(224 243)" stroke="#4CC2FF" stroke-width="3" fill="#4CC2FF" stroke-linecap="round">
      <line x1="0" y1="4" x2="26" y2="4"/>
      <path d="M26 4 L18 -1 L18 9 Z" stroke="none"/>
      <line x1="26" y1="16" x2="0" y2="16"/>
      <path d="M0 16 L8 11 L8 21 Z" stroke="none"/>
    </g>
    <text x="280" y="256" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif"
          font-size="27" font-weight="600" fill="#4CC2FF">продолжить,</text>
  </g>
</svg>
